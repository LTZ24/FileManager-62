<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload Worker</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <script src="/assets/js/upload-manager.js"></script>
  <script>
    // Persistent upload worker: receives files via postMessage and uploads them.

    const base = window.baseUrl || '';
    // create manager if absent
    if (!window.uploadManager) {
      window.uploadManager = new UploadManager({ baseUrl: base });
      // Hide UI in worker window to keep it unobtrusive
      if (window.uploadManager.uploadContainer) {
        window.uploadManager.uploadContainer.style.display = 'none';
      }
    }

    function broadcastState() {
      try {
        const items = (window.uploadManager.uploadQueue || []).map(i => ({
          id: i.id,
          name: (i.file && i.file.name) ? i.file.name : (i.name || ''),
          size: (i.file && i.file.size) ? i.file.size : (i.size || 0),
          category: i.category || '',
          status: i.status || 'pending',
          progress: i.progress || 0,
          error: i.error || null
        }));
        localStorage.setItem('uploadManager:state', JSON.stringify({ ts: Date.now(), items }));
      } catch (e) {}
    }

    // Broadcast periodically and on changes
    setInterval(broadcastState, 800);

    // Wrap updateUploadItem/updateSummary to broadcast state when called
    const origUpdate = window.uploadManager.updateUploadItem.bind(window.uploadManager);
    window.uploadManager.updateUploadItem = function(item) {
      origUpdate(item);
      try { broadcastState(); } catch (e) {}
    };

    const origRender = window.uploadManager.renderUploadItem.bind(window.uploadManager);
    window.uploadManager.renderUploadItem = function(item) {
      origRender(item);
      try { broadcastState(); } catch (e) {}
    };

    const origAdd = window.uploadManager.addFiles.bind(window.uploadManager);
    window.uploadManager.addFiles = function(files, category) {
      const res = origAdd(files, category);
      try { broadcastState(); } catch (e) {}
      return res;
    };

    // Listen for messages from opener/pages
    window.addEventListener('message', (e) => {
      try {
        const data = e.data || {};
        if (data && data.type === 'addFiles') {
          // If files are provided as {id,file} preserve ids
          if (Array.isArray(data.files) && data.files.length && data.files[0] && data.files[0].id && data.files[0].file) {
            for (const f of data.files) {
              try {
                const uploadItem = {
                  id: f.id,
                  file: f.file,
                  category: data.category || '',
                  status: 'pending',
                  progress: 0,
                  error: null
                };
                window.uploadManager.uploadQueue.push(uploadItem);
                window.uploadManager.renderUploadItem(uploadItem);
              } catch (ie) {}
            }
            // start processing
            try { window.uploadManager.processQueue(); } catch (pe) {}
            try { broadcastState(); } catch (be) {}
          } else {
            // Received files as plain File[]
            window.uploadManager.addFiles(data.files || [], data.category || '');
          }
        }
      } catch (err) {}
    }, false);

    // Also support abort requests for specific item ids
    window.addEventListener('message', (e) => {
      try {
        const data = e.data || {};
        if (data && data.type === 'abort' && data.id) {
          const idx = (window.uploadManager.uploadQueue || []).findIndex(i => i.id === data.id);
          if (idx !== -1) {
            const item = window.uploadManager.uploadQueue[idx];
            if (item && item.xhr) {
              try { item.xhr.abort(); } catch (e) {}
              item.status = 'cancelled';
              try { window.uploadManager.updateUploadItem(item); } catch (e) {}
              try { broadcastState(); } catch (e) {}
            }
          }
        }
      } catch (err) {}
    }, false);

    // If opened with an opener that supports postMessage, notify ready
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'uploadWorkerReady' }, '*');
      }
    } catch (e) {}

    // Keep the worker window running
  </script>
</body>
</html>
